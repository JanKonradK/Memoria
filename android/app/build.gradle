apply plugin: 'com.android.application'

// The version comes from the root package.json, like every other build. The
// code orders releases for Android: 0.1.0 becomes 1000100. Versions restarted
// at 0.1.0 after 4.0.3 (code 40003), so the restarted line adds 1000000 to stay
// above it: Android only installs a higher code over an existing app.
def memoriaVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def memoriaVersionCode = 1000000 + memoriaVersion.tokenize('.-').take(3).collect { it.toInteger() }.inject(0) { code, part -> code * 100 + part }

android {
    namespace = "app.memoria.tracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.memoria.tracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode memoriaVersionCode
        versionName memoriaVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Every published APK must carry the key already on people's devices,
        // or Android refuses to update the app. CI restores that key into the
        // default debug keystore location, so local and CI builds match.
        memoria {
            storeFile file(System.getenv('MEMORIA_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword System.getenv('MEMORIA_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('MEMORIA_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('MEMORIA_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.memoria
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // Two builds of one app. `direct` is the APK on GitHub releases: it updates
    // itself and rings alarm-style reminders as real alarms. `play` is the Google
    // Play build: Play updates it, so it carries no APK installer, and its
    // manifest (src/play) drops the permissions Play reserves for other apps.
    // See docs/play-store-compliance.md.
    flavorDimensions += "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "boolean", "IS_PLAY_BUILD", "false"
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "IS_PLAY_BUILD", "true"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // One Kotlin standard library for every Kotlin-built dependency (CameraX,
    // lifecycle, ML Kit), so the old jdk7/jdk8 split never duplicates classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.25')
    // The camera reader: CameraX for the viewfinder, and ML Kit's bundled text
    // recognition (v2), which reads on the phone with no download and no network.
    // Both ship 16 KB-aligned native code; check-android.mjs verifies it.
    def cameraxVersion = '1.4.2'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Automatic backups write into a folder the player picked (Storage Access Framework).
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
