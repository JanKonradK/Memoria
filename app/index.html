<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      try {
        const uiKey = 'void-ui';
        const legacyUiKey = 'technogg-ui';
        let storedUiValue = localStorage.getItem(uiKey);
        if (storedUiValue === null) {
          const legacyUiValue = localStorage.getItem(legacyUiKey);
          if (legacyUiValue !== null) {
            try {
              localStorage.setItem(uiKey, legacyUiValue);
              if (localStorage.getItem(uiKey) === legacyUiValue) localStorage.removeItem(legacyUiKey);
            } catch {
              // Keep using the source value and leave it intact for a later retry.
            }
            storedUiValue = localStorage.getItem(uiKey) || legacyUiValue;
          }
        }
        const storedUi = JSON.parse(storedUiValue || '{}');
        const size = storedUi?.state?.textSize || 'm';
        const scales = { s: 0.9, m: 1, l: 1.12, xl: 1.28 };
        document.documentElement.style.setProperty('--ui-scale', String(scales[size] || 1));
      } catch {
        document.documentElement.style.setProperty('--ui-scale', '1');
      }
    </script>
    <title>Void</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
