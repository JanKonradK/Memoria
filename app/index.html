<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      try {
        const storedUi = JSON.parse(localStorage.getItem('technogg-ui') || '{}');
        const size = storedUi?.state?.textSize || 'm';
        const scales = { s: 0.9, m: 1, l: 1.12, xl: 1.28 };
        document.documentElement.style.setProperty('--ui-scale', String(scales[size] || 1));
      } catch {
        document.documentElement.style.setProperty('--ui-scale', '1');
      }
    </script>
    <title>Techno's Library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
