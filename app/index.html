<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Before any module: the content policy forbids code generation, and Zod
      // probes for it with new Function() the first time anything is parsed.
      globalThis.__zod_globalConfig = Object.assign(globalThis.__zod_globalConfig || {}, { jitless: true });
      // Runs before first paint. A theme applied inside React flashes the dark
      // ground on a light-theme load, and the ground is the whole page.
      try {
        const uiKey = 'memoria-ui';
        const legacyKeys = ['void-ui', 'technogg-ui'];
        let stored = localStorage.getItem(uiKey);
        if (stored === null) {
          for (const legacyKey of legacyKeys) {
            const legacy = localStorage.getItem(legacyKey);
            if (legacy === null) continue;
            try {
              localStorage.setItem(uiKey, legacy);
              if (localStorage.getItem(uiKey) === legacy) localStorage.removeItem(legacyKey);
            } catch {
              // Keep using the source value and leave it intact for a later retry.
            }
            stored = localStorage.getItem(uiKey) || legacy;
            break;
          }
        }
        const saved = JSON.parse(stored || '{}')?.state ?? {};
        // Follows the device unless a theme was chosen.
        const choice = saved.themePreference ?? saved.theme ?? 'system';
        const theme =
          choice === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : choice;
        const mode = theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = mode;
        let ground = mode === 'light' ? '#f6f7f9' : null;
        // A chosen colour palette, written by applyTheme in ui-store.ts.
        const paint = JSON.parse(localStorage.getItem('memoria-paint') || '{}')?.[mode];
        if (paint && typeof paint.vars === 'object') {
          for (const name of Object.keys(paint.vars)) {
            if (name.startsWith('--')) document.documentElement.style.setProperty(name, String(paint.vars[name]));
          }
          if (/^#[\da-f]{6}$/i.test(paint.ground)) ground = paint.ground;
        }
        if (ground) document.querySelector('meta[name="theme-color"]').setAttribute('content', ground);
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>Memoria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
