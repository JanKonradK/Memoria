<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Runs before first paint. A theme applied inside React flashes the dark
      // ground on a light-theme load, and the ground is the whole page.
      try {
        const uiKey = 'memoria-ui';
        const legacyKeys = ['void-ui', 'technogg-ui'];
        let stored = localStorage.getItem(uiKey);
        if (stored === null) {
          for (const legacyKey of legacyKeys) {
            const legacy = localStorage.getItem(legacyKey);
            if (legacy === null) continue;
            try {
              localStorage.setItem(uiKey, legacy);
              if (localStorage.getItem(uiKey) === legacy) localStorage.removeItem(legacyKey);
            } catch {
              // Keep using the source value and leave it intact for a later retry.
            }
            stored = localStorage.getItem(uiKey) || legacy;
            break;
          }
        }
        const theme = JSON.parse(stored || '{}')?.state?.theme;
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#efeae0');
        }
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>Memoria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
