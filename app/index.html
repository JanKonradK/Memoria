      }

      }
      .splash-word span {
        display: block;

        animation:

      #splash.go .splash-word span {
        animation: splash-word-in 460ms cubic-bezier(0.16, 1, 0.3, 1) 860ms both;

      /* A shade short of opaque once the app has drawn: the browser skips
         painting what a solid layer hides, and would otherwise paint the whole
         app in the first frame of the fade. Invisible: one level of 255. */
      #splash.warm {
        background: rgba(12, 13, 15, 0.996);
      }
      /* The exit: the mark lifts toward the viewer and the name glides up and
         out first, then the ground dissolves off the app, so neither ever sits
         over the page's words. */
      #splash.leave {
        pointer-events: none;
        animation: splash-out 420ms cubic-bezier(0.33, 0, 0.2, 1) 120ms both;
      }
      #splash.leave .splash-stage {

          splash-out 260ms cubic-bezier(0.2, 0, 0.4, 1) both,
          splash-lift 380ms cubic-bezier(0.5, 0, 0.75, 0) both;

        animation: splash-word-out 220ms cubic-bezier(0.4, 0, 1, 1) both;
      }

        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

        from {
          transform: scale(0.92) translateY(4px);
        }
        to {
          transform: none;
        }

      @keyframes splash-halo {

          opacity: 0;
          transform: scale(0.84) rotate(-22deg);

          opacity: 1;
        }

          opacity: 0;

        from {

        to {

        }

        from {

        }

        from {
          opacity: 1;

        to {

        }

          opacity: 0;
          transform: translateY(8px);

        to {
          opacity: 1;
          transform: none;
        }

        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes splash-lift {
        from {
          transform: none;
        }
        to {
          transform: scale(1.06);
        }
      }
      @keyframes splash-word-out {
        from {
          opacity: 1;
          transform: none;
        }
        to {
          opacity: 0;
          transform: translateY(-4px);
        }

         mark and its name fade in, and the ground fades off the app. */
      @media (prefers-reduced-motion: reduce) {
        .splash-halo,
        .splash-curtain,
        .splash-sheen {
          display: none;
        }
        .splash-mark,
        .splash-word span {
          transform: none;
        }
        #splash.go .splash-mark,
        #splash.go .splash-glow,
        #splash.go .splash-word span {
          animation: splash-in 300ms ease-out 120ms both;
        }
        #splash.leave {
          animation: splash-out 240ms ease-out both;
        }
        #splash.leave .splash-stage,
        #splash.leave .splash-word {
          animation: none;
        }

  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-lockup">
        <div class="splash-stage">
          <div class="splash-glow"></div>
          <div class="splash-halo"></div>
          <div class="splash-mark">
            <div class="splash-curtain"></div>
            <div class="splash-sheen"></div>
          </div>
        </div>
        <div class="splash-word"><span>Memoria</span></div>
      </div>
    </div>
    <script>
      // Starts the intro once the still ground is on screen, so its first frame
      // is the first one seen. A hidden window (the PC app shows its window only
      // when the page has loaded) waits until it is shown. Automated browsers
      // skip it.
      (function () {
        var splash = document.getElementById('splash');
        if (navigator.webdriver) return splash.remove();
        var start = function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              splash.classList.add('go');
              window.__memoriaSplashAt = performance.now();
            });
          });
        };
        if (document.visibilityState !== 'hidden') return start();
        document.addEventListener('visibilitychange', function shown() {
          if (document.visibilityState === 'hidden') return;
          document.removeEventListener('visibilitychange', shown);
          start();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
