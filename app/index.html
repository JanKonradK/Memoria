      try {

        const legacyKeys = ['void-ui', 'technogg-ui'];
        let stored = localStorage.getItem(uiKey);
        if (stored === null) {
          for (const legacyKey of legacyKeys) {
            const legacy = localStorage.getItem(legacyKey);
            if (legacy === null) continue;
            try {
              localStorage.setItem(uiKey, legacy);
              if (localStorage.getItem(uiKey) === legacy) localStorage.removeItem(legacyKey);
            } catch {

            }

        const choice = saved.themePreference ?? saved.theme ?? 'system';

          choice === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : choice;

        let ground = mode === 'light' ? '#f6f7f9' : null;

        const paint = JSON.parse(localStorage.getItem('memoria-paint') || '{}')?.[mode];

          for (const name of Object.keys(paint.vars)) {
            if (name.startsWith('--')) document.documentElement.style.setProperty(name, String(paint.vars[name]));

      }

        to {
          transform: translateX(71.43%);
        }
      }
      @keyframes splash-glint {
        from {
          transform: translateX(-100%);
        }
        to {

      @keyframes splash-breathe {
        from {
          opacity: 1;
        }
        to {

        from {
          opacity: 1;

        to {

          animation: splash-in 300ms ease-out 120ms both;

        }

    <title>Memoria</title>

  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-stage">
        <div class="splash-glow"></div>
        <div class="splash-mark">
          <div class="splash-curtain"></div>
          <div class="splash-sheen"></div>
        </div>
      </div>
    </div>
    <script>
      // Starts the intro once the still ground is on screen, so its first frame
      // is the first one seen. A hidden window (the PC app shows its window only
      // when the page has loaded) waits until it is shown. Automated browsers
      // skip it.
      (function () {
        var splash = document.getElementById('splash');
        if (navigator.webdriver) return splash.remove();
        var start = function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              splash.classList.add('go');
              window.__memoriaSplashAt = performance.now();
            });
          });
        };
        if (document.visibilityState !== 'hidden') return start();
        document.addEventListener('visibilitychange', function shown() {
          if (document.visibilityState === 'hidden') return;
          document.removeEventListener('visibilitychange', shown);
          start();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
