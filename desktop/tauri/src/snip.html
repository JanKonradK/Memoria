<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture game screenshot · Memoria</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
        font:
          14px/1.4 system-ui,
          'Segoe UI',
          sans-serif;
      }
      #shot,
      #dim {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        pointer-events: none;
      }
      #shot {
        -webkit-user-drag: none;
      }
      .box {
        position: fixed;
        box-sizing: border-box;
        outline: 2px solid #8ab4ff;
        pointer-events: none;
      }
      .box.draft {
        display: none;
        outline-style: dashed;
      }
      body.dragging .box.draft {
        display: block;
      }
      .tag {
        position: absolute;
        top: -26px;
        display: flex;
        align-items: center;
        gap: 4px;
        pointer-events: none;
      }
      .tag.left {
        left: -2px;
      }
      .tag.right {
        right: -2px;
      }
      .box.low .tag {
        top: auto;
        bottom: -26px;
      }
      .num,
      .remove {
        min-width: 22px;
        height: 22px;
        box-sizing: border-box;
        border-radius: 6px;
        background: #8ab4ff;
        color: #0b1220;
        font-weight: 700;
        font-size: 13px;
        line-height: 22px;
        text-align: center;
        padding: 0 6px;
      }
      .remove {
        border: 0;
        margin: 0;
        cursor: pointer;
        pointer-events: auto;
        font: inherit;
        font-weight: 700;
        line-height: 22px;
      }
      .remove:hover,
      .remove:focus-visible {
        background: #f2f3f5;
        outline: 2px solid #0b1220;
        outline-offset: -2px;
      }
      #bar {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 32px);
        padding: 6px 6px 6px 16px;
        box-sizing: border-box;
        border-radius: 999px;
        background: rgba(16, 17, 20, 0.92);
        color: #f2f3f5;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        cursor: default;
        pointer-events: auto;
        transition: opacity 120ms ease;
      }
      body.dragging #bar {
        opacity: 0.15;
        pointer-events: none;
      }
      #hint {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        padding-right: 4px;
      }
      #bar button {
        flex: none;
        height: 32px;
        padding: 0 14px;
        border: 1px solid rgba(242, 243, 245, 0.18);
        border-radius: 999px;
        background: transparent;
        color: inherit;
        font: inherit;
        white-space: nowrap;
        cursor: pointer;
      }
      #bar button:hover {
        background: rgba(242, 243, 245, 0.12);
      }
      #bar button:focus-visible {
        outline: 2px solid #8ab4ff;
        outline-offset: 2px;
      }
      #bar button.primary {
        border-color: transparent;
        background: #8ab4ff;
        color: #0b1220;
        font-weight: 600;
      }
      #bar button.primary:hover {
        background: #a8c7ff;
      }
      #bar button[hidden] {
        display: none;
      }
      #bar button:disabled {
        opacity: 0.5;
        cursor: progress;
      }
      @media (prefers-reduced-motion: reduce) {
        #bar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="dim"></canvas>
    <div id="boxes"></div>
    <div id="draft" class="box draft"></div>
    <div id="bar" role="toolbar" aria-label="Screen capture">
      <span id="hint" role="status" aria-live="polite">Drag around each number to read · up to 8 regions</span>
      <button type="button" id="read" class="primary">Read whole screen (Enter)</button>
      <button type="button" id="whole" hidden>Whole screen</button>
      <button type="button" id="undo" hidden>Undo</button>
      <button type="button" id="clear" hidden>Clear</button>
      <button type="button" id="cancel">Cancel (Esc)</button>
    </div>
    <script src="/__memoria-snip.js"></script>
  </body>
</html>
