[package]
name = "memoria"
version = "0.2.2"
description = "Memoria for Windows"
edition = "2024"
publish = false

[[bin]]
name = "Memoria"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
# Native dialogs. Not tauri-plugin-dialog: it replaces the page's window.confirm
# with an async version, which would let a close skip the unsaved-changes check.
rfd = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
rquickjs = "0.14"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
base64 = "0.23"
rand = "0.10"
if-addrs = "0.15"
iana-time-zone = "0.1"
jiff = "1"
notify = { version = "8", default-features = false }

[target.'cfg(windows)'.dependencies]
# The same WebView2 bindings Tauri uses, for trimming memory while hidden.
webview2-com = "0.39"
windows-core = "0.100"
winreg = "0.56"
tauri-winrt-notification = "0.8"
# The WinRT bindings the toast crate already uses, to read whether Windows lets Memoria's toasts through.
windows = { version = "0.62", features = ["UI_Notifications"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Small and fast to load: the point of moving off Electron.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
