[package]
name = "memoria-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
hmac = "0.13.0"
humantime = "2.4.0"
iana-time-zone = "0.1.65"
if-addrs = "0.15.0"
notify = "8.2.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "json"] }
# Native dialogs. Not tauri-plugin-dialog: it replaces window.confirm in the page
# with an asynchronous call, so "Discard your unsaved changes?" could never say no.
rfd = { version = "0.16.1", default-features = false, features = ["common-controls-v6"] }
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = "2.12.5"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
tauri-build = "2.7.4"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"

[features]
# Production builds. Without it Tauri treats the binary as a development build.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
