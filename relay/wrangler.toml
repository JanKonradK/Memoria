# Memoria's internet relay. Deploy with `npx wrangler deploy` from this folder;
# see README.md. Durable Objects on SQLite storage are on Cloudflare's free plan.
name = "memoria-relay"
main = "src/index.mjs"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
