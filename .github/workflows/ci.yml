name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The launcher, the packaging script and the shortcut installer are all
    # Windows-specific, so the checks that matter run where users run them.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci
      - run: npm run audit

      # lint, format:check, typecheck, tests, build, PWA budget.
      - run: npm run check

      # Proves the download can actually be assembled from this commit, so a
      # packaging break is caught on the PR that causes it rather than at tag
      # time. The zip is not published from here.
      - run: npm run package
      - run: npm run build:single
      - run: npm exec -- playwright install chromium
      - run: npm run check:release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memoria-win-x64-${{ github.sha }}
          path: dist/release/Memoria-win-x64.zip
          retention-days: 7
