name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET_ENV"
      - name: Deploy Worker and assets
        working-directory: worker
        run: npx wrangler deploy --env "$TARGET_ENV"
      - name: Smoke test
        env:
          DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
        run: |
          test -n "$DEPLOY_ORIGIN"
          curl --fail --retry 5 --retry-delay 5 "$DEPLOY_ORIGIN/api/health"
