name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci
      - run: npm run audit

      # A tag never ships without passing everything main has to pass.
      - run: npm run check

      - name: Refuse a tag that disagrees with package.json
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          declared="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$declared" ]; then
            echo "Tag $tag does not match package.json ($declared)."
            echo "The updater compares the tag to release.json, which is written from package.json;"
            echo "shipping them out of step would make the new build look older than it is."
            exit 1
          fi

      # The downloadable zip, plus the single-file HTML for anyone who just
      # wants to try it without unpacking anything.
      - run: npm run package
      - run: npm run build:single
      - run: npm exec -- playwright install chromium
      - run: npm run check:release

      - name: Add the single-file build to the checksums
        shell: bash
        run: |
          cp app/dist-single/Memoria.html dist/release/Memoria.html
          cd dist/release
          sha256sum Memoria.html >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Memoria ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/release/Memoria-win-x64.zip
            dist/release/Memoria.html
            dist/release/SHA256SUMS.txt
          body: |
            ## Download

            | | |
            |---|---|
            | **[Memoria-win-x64.zip](https://github.com/JanKonradK/Memoria/releases/download/${{ github.event.inputs.tag || github.ref_name }}/Memoria-win-x64.zip)** | Windows app. Unpack anywhere, run `Start Memoria.cmd`. Includes its own Node — nothing to install. **Updates itself.** |
            | [Memoria.html](https://github.com/JanKonradK/Memoria/releases/download/${{ github.event.inputs.tag || github.ref_name }}/Memoria.html) | The whole app in one file. Double-click to open in any browser. Does **not** update itself — download a newer one when you want it. |

            Your data stays in `%APPDATA%\memoria` and is never touched by an update.

            Verify a download against `SHA256SUMS.txt` if you like:
            `Get-FileHash .\Memoria-win-x64.zip -Algorithm SHA256`
