name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  browser:
    needs: source
    uses: ./.github/workflows/browser-gates.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  release:
    needs: [source, browser]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      # The Windows program is Rust (desktop/tauri). The runner image ships rustup.
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - run: npm ci
      - run: npm run audit

      # A tag never ships without passing everything main has to pass.
      - run: npm run check

      - name: Refuse a tag that disagrees with package.json
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          declared="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$declared" ]; then
            echo "Tag $tag does not match package.json ($declared)."
            echo "The updater compares the tag to release.json, which is written from package.json;"
            echo "shipping them out of step would make the new build look older than it is."
            exit 1
          fi

      # The downloadable zip, plus the single-file HTML for anyone who just
      # wants to try it without unpacking anything.
      # Add MEMORIA_SIGNING_KEY (the PEM contents) as an Actions secret before releasing.
      - run: npm run package
        env:
          MEMORIA_SIGNING_KEY: ${{ secrets.MEMORIA_SIGNING_KEY }}
      - run: npm run build:single
      - run: npm exec -- playwright install chromium
      - run: npm run check:release
      # Windows 10 and 11 ship the WebView2 runtime the app draws with; the
      # Windows Server runner image may not, so install it before the native check.
      - name: Install the WebView2 runtime if it is missing
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if (-not $version -or $version -eq '0.0.0.0') {
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            Start-Process $setup -ArgumentList '/silent', '/install' -Wait
            $version = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          }
          if (-not $version) { throw 'The WebView2 runtime could not be installed.' }
          "WebView2 runtime $version"
      - run: npm run check:native

      # The Android app only accepts an update signed with the key it was
      # installed with, so a release without that key must not ship an APK.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Restore the Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      # Appends Memoria-android.apk to SHA256SUMS.txt, which the app checks.
      - run: npm run build:android

      - name: Add the single-file build to the checksums
        shell: bash
        run: |
          cp app/dist-single/Memoria.html dist/release/Memoria.html
          cd dist/release
          sha256sum Memoria.html >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign all release assets
        run: node scripts/sign-release.mjs
        env:
          MEMORIA_SIGNING_KEY: ${{ secrets.MEMORIA_SIGNING_KEY }}

      # The app shows everything above "## Download" as the release notes.
      # Write them in docs/releases/<tag>.md before tagging.
      - name: Write the release notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          # People see versions as betas with a 0. in front (v3.3.0 reads "Beta 0.3.3").
          # The tag keeps the real number, which is what installed copies compare.
          version="${tag#v}"
          echo "title=Memoria Beta 0.${version%.0}" >> "$GITHUB_OUTPUT"
          notes="docs/releases/$tag.md"
          download="https://github.com/JanKonradK/Memoria/releases/download/$tag"
          {
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            echo "## Download"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **[Memoria-win-x64.zip]($download/Memoria-win-x64.zip)** | Standalone Windows app. Extract the ZIP and run \`Add Memoria to Start Menu.cmd\`. Uses the WebView2 runtime built into Windows. |"
            echo "| **[Memoria-android.apk]($download/Memoria-android.apk)** | Android app. Open the APK on your phone or tablet and install it over the existing app. |"
            echo "| [Memoria.html]($download/Memoria.html) | The whole app in one file. Double-click to open in any browser. |"
            echo
            echo "Installed apps update themselves: open **Settings → Updates**, or follow the notice when Memoria finds a new version."
            echo "Your data stays on each device and is never touched by an update."
            echo
            echo "Verify a download against \`SHA256SUMS.txt\` if you like: \`Get-FileHash .\Memoria-win-x64.zip -Algorithm SHA256\`"
            # Browsers can read the release body through GitHub's CORS-enabled API.
            # The asset download endpoint does not allow browser cross-origin reads.
            node -e "process.stdout.write('<!-- memoria-signed-release ' + require('node:fs').readFileSync('dist/release/release-manifest.json', 'utf8').trim() + ' -->\n')"
          } > dist/release-notes.md
          cat dist/release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.notes.outputs.title }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/release/Memoria-win-x64.zip
            dist/release/Memoria-android.apk
            dist/release/Memoria.html
            dist/release/SHA256SUMS.txt
            dist/release/release-manifest.json
          body_path: dist/release-notes.md
